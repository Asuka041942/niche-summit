/* v0.6 — 无人物插画的平面视觉系统 + 情绪化按钮 */
:root{--paper:#f8f7f0;--panel:#fffdf7;--ink:#20211b;--gray:#77786d;--line:#e6e4d8;--green:#d4ff46;--subgreen:#edffbf;--deep:#262e12;--r:18px}
body{background:#e8e8df;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.app{width:min(100%,580px);background:var(--panel);box-shadow:0 0 90px #10150710}
.bar{height:66px;border-bottom:1px solid #e8e6d9;padding:0 23px}.logo{font-weight:960;font-size:16px;letter-spacing:-.85px}.bar-right{font-size:10px}.dot{background:#b0d638}
.main{padding:30px 25px 42px}.eyebrow{color:#777c6d;font-size:11px;font-weight:800;letter-spacing:1.35px}
.h1{font-size:clamp(47px,10vw,73px);letter-spacing:-4px;line-height:1.13;margin:14px 0 17px}.h2{font-size:clamp(34px,8vw,49px);line-height:1.17;letter-spacing:-2.2px;margin:13px 0 18px}
.lead{font-size:13px;line-height:1.8;color:#77776e}.rank-box{background:#f1f0e8;border:0;border-radius:19px;padding:23px 23px 20px}.rank-num{font-size:56px}.rank-name{color:#686c56}
.meter{height:7px;background:#deded4;margin-top:22px}.meter-inner{background:#c7ee49}
.category{letter-spacing:.7px;margin-top:22px}.groups{gap:9px!important;margin-bottom:4px!important}.chip{background:#f3f1e9;border:1px solid #e3e0d6;font-size:12px;padding:10px 14px;transition:background .15s ease, transform .18s ease,box-shadow .18s ease}
.chip.active{background:#d4ff46;border-color:#9baa55;box-shadow:0 3px 0 #485127;transform:translateY(-2px)}
.btn{border:1.7px solid #242620;min-height:53px;border-radius:999px;padding:14px 20px;background:#242620;box-shadow:0 4px 0 #161814;font-size:14px;font-weight:900;transition:transform .16s cubic-bezier(.2,1.4,.6,1),box-shadow .16s,filter .2s,background .18s;touch-action:manipulation;position:relative}
.btn:hover{background:#35382f;filter:brightness(1.02)}
.btn:active{transform:translateY(4px) scale(.988);box-shadow:0 0 0 #1e2311}
.btn.green{background:var(--green);color:#161911;border-color:#20221b;box-shadow:0 5px 0 #343a20}
.btn.green:hover{background:#ddff6e}
.btn.ghost,.btn.outline{background:#fffdf7;color:#25271e;border:1.5px solid #a9aaa0;box-shadow:0 3px 0 #c9c8bd}
.btn.ghost:hover,.btn.outline:hover{background:#f4f2ea}
.btn.ghost:active,.btn.outline:active{box-shadow:0 0 0 #c9c8bd}
.btn.big-game{min-height:65px;font-size:16px;letter-spacing:.25px}
.btn.emote-yes,.btn.emote-no{width:100%;height:104px;text-align:left;justify-content:space-between;font-size:clamp(27px,6vw,38px);font-weight:950;letter-spacing:-1.2px;border-radius:24px;padding:20px 23px;line-height:1.05}
.btn.emote-yes{background:var(--green);color:#1d2412;border:2px solid #222720;box-shadow:0 7px 0 #323c20;transform:translateY(0)}
.btn.emote-no{background:#eeece7;color:#65625e;border:2px solid #bab9b2;box-shadow:0 5px 0 #b9b7b1}
.emote-mark{font-size:12px;font-weight:900;letter-spacing:1px;opacity:.75}
.emotion-choices{display:grid;grid-template-columns:1fr;gap:18px;margin-top:27px}
.btn.emote-yes.is-playing{animation:yesJump .55s cubic-bezier(.2,.7,.2,1) both}
.btn.emote-no.is-playing{animation:noSink .55s cubic-bezier(.25,.6,.25,1) both}
@keyframes yesJump{0%{transform:translateY(0) scale(1);box-shadow:0 7px 0 #323c20}27%{transform:translateY(-12px) scale(1.045) rotate(-1.5deg);box-shadow:0 15px 0 #323c20,0 0 35px #ceff6c85}62%{transform:translateY(1px) scale(.988) rotate(1deg);box-shadow:0 3px 0 #323c20}100%{transform:translateY(0) scale(1);box-shadow:0 7px 0 #323c20}}
@keyframes noSink{0%{transform:translateY(0) scale(1);filter:grayscale(0)}35%{transform:translateY(5px) scale(.975,.91);box-shadow:0 0 0 #b9b7b1;filter:grayscale(.25)}68%{transform:translateY(1px) scale(1.01,.99);box-shadow:0 3px 0 #b9b7b1}100%{transform:translateY(0) scale(1);box-shadow:0 5px 0 #b9b7b1}}
.btn.green.big-game:not(:disabled):active{animation:startPop .34s ease}
@keyframes startPop{50%{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 #343a20}}
.voice-circle{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1.5px solid currentColor;border-radius:50%;font-size:18px;flex-shrink:0}
.vinyl{width:82px;height:82px;border-radius:50%;background:repeating-radial-gradient(circle at center,#242721 0 3px,#343730 4px 5px,#22251f 6px 8px);display:grid;place-items:center;box-shadow:7px 9px 0 #dbdace;transform:rotate(-10deg)}
.vinyl::before{content:'';width:32px;height:32px;border-radius:50%;background:var(--green);border:6px solid #20241f;box-shadow:inset 0 0 0 5px #d4ff46}
.hero{margin:18px 0 29px;padding:23px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.hero-title{font-size:clamp(36px,8vw,59px);font-weight:950;line-height:1.14;letter-spacing:-2.6px}
.hero-title .hl{background:linear-gradient(transparent 61%,#d4ff46 61%)}
.hero-lead{font-size:12px;color:#747569;margin-top:17px}
.rank-box .rhead{align-items:center}.mini-badge{border-color:#d8d6c8}.opponent{background:#f8f7f1;border:1px solid var(--line);border-radius:22px;padding:21px}
.face{border-radius:15px;background:#d4ff46;color:#20241a;font-size:21px;transform:rotate(-5deg)}
.history{background:#eeede6;border-radius:13px}
.chat{margin:26px 0 29px;gap:19px}.message{max-width:91%}.who{font-size:10px}.bubble{border:1.5px solid #d6d5ca;background:#f2f1e9;border-radius:22px 22px 22px 5px;font-size:17px;line-height:1.65;padding:15px 18px}
.me .bubble{border-color:#c1d989;background:#edffce;border-radius:22px 22px 5px 22px}
.track{margin:21px 0 30px}.barline{height:7px;background:#ebe9de}.barline.done{background:#cbf36d}.barline.current{background:#333b23}
.field{min-height:56px;background:#fffef9;border:1.5px solid #d5d5c9;border-radius:14px;font-size:15px}.field:focus{outline:none;border-color:#98b63e;box-shadow:0 0 0 3px #d4ff4670}
.form-row label{font-size:13px;margin-bottom:11px}.suggestions{margin:7px 0 0;max-height:284px;border:1px solid #dfded2;box-shadow:0 12px 24px #23281b12;overflow-y:auto}.suggestion{font-size:14px;padding:14px 12px}.suggestion:hover{background:#f2f9dd}.suggestion small{max-width:56%;text-align:right;line-height:1.3}
.suggest-remote-badge{display:inline-block;font-size:10px;color:#5f7946;background:#eaffc6;border-radius:4px;padding:3px 6px;white-space:nowrap}
.search-status{font-size:11px;color:#777b70;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0}
.note,.status,.final-rank{border:1px solid #e7e4d7;background:#f8f7f1;border-radius:20px;padding:20px}
.status.win{background:#f1ffcf}.status.loss{background:#f7f2ec}
.big-status{letter-spacing:-2px}.big-status.win{color:#3d571b}.big-status.loss{color:#7b705f}
.delta.up{color:#4f711e}.delta.down{color:#777166}.tag{background:#eaf8c8}.foot{background:#f9f7f0;border-top:1px solid #e9e6da}
.summary-strap{font-size:12px;background:#eefecc;padding:11px 16px;border-radius:100px;display:inline-flex;gap:8px;align-items:center;margin-bottom:12px}
@media(max-width:520px){.main{padding:24px 19px 36px}.bar{height:60px;padding:0 18px}.logo{font-size:14px}.rank-box{padding:20px}.hero{margin:8px 0 22px}.vinyl{width:69px;height:69px;flex-shrink:0}.hero-title{font-size:42px}.btn.emote-yes,.btn.emote-no{height:97px}.emotion-choices{gap:16px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* v0.9 情绪聊天：轻度表情、隐形安利凭据，保持无卡通图的极简界面 */
.message.feels .bubble{font-weight:660;letter-spacing:-.15px;box-shadow:0 2px 0 rgba(30,43,14,.04)}
.message.feels.me .bubble{background:#e3ff9e}
.message.feels:not(.me) .bubble{border-left:3px solid #d0eb9c}
.proof-card{border:1.5px solid #dedfcf;background:#fafbf3;padding:19px;border-radius:20px;margin:16px 0 18px}
.proof-head{font-weight:900;font-size:18px;letter-spacing:-.4px;margin:0 0 8px}

/* v1.0 supplementary components, entirely CSS and no illustrations */
.mode-tabs{display:flex;gap:9px;margin:-9px 0 7px}

/* 单机 v1.0 补丁：时限只作提醒，不更改原有判定规则 */

function makeLuceneSongQuery(term,artist,mbid,kind='recording'){
 // MusicBrainz uses Lucene: song/album search must include the artist,
 // otherwise unrelated records would be incorrectly suggested.
 const clean=v=>String(v).replace(/[^\p{L}\p{N}\s]/gu,' ').trim().slice(0,75);
 const words=clean(term).split(/\s+/).filter(Boolean).slice(0,4);
 const name=clean(artist);if(!words.length||!name)return '';
 const field=kind==='recording'?'recording':'releasegroup';
 const titleQuery=words.map(w=>`${field}:${w}*`).join(' AND ');
 const artistQuery=mbid&&/^[0-9a-f-]{36}$/i.test(mbid)?`arid:${mbid}`:`artistname:"${name}"`;
 return titleQuery+' AND '+artistQuery;
}
// Use a small offline index immediately, then asynchronously enrich suggestions.
// No unsolicited popular-song list; the user must recall part of the title first.
let soloSearchQueue=Promise.resolve();
function musicBrainzPermit(){
 const job=soloSearchQueue.catch(()=>{}).then(async()=>{
  const wait=Math.max(0,1120-(Date.now()-lastNetworkCall));
  if(wait)await new Promise(r=>setTimeout(r,wait));
  lastNetworkCall=Date.now();
 });
 soloSearchQueue=job.catch(()=>{});return job;
}
async function musicBrainzSongFetch(kind,field,term,ctx,ctrl,token){
 const query=makeLuceneSongQuery(term,ctx.artist,ctx.mbid,kind);
 if(!query)return [];
 await musicBrainzPermit();if(token!==soloSongSeq||ctrl.signal.aborted)return [];
 const endpoint=kind==='recording'?'recording':'release-group';
 const url=`https://musicbrainz.org/ws/2/${endpoint}/?query=${encodeURIComponent(query)}&fmt=json&limit=15`;
 const response=await fetch(url,{signal:ctrl.signal,headers:{Accept:'application/json'}});
 if(!response.ok)throw Error('HTTP '+response.status);
 const data=await response.json();
 const entries=kind==='recording'?data.recordings:data['release-groups'];
 const seen=new Set();return(entries||[]).map(v=>({title:v.title,source:kind==='recording'?'曲目 · MusicBrainz':'专辑 · MusicBrainz'})).filter(x=>{
  const k=norm(x.title);if(!k||seen.has(k))return false;seen.add(k);return true
 }).slice(0,8);
}
async function searchSoloSong(field,query,token){

 if(soloSongCache.has(key)){
  if(token===soloSongSeq){const saved=soloSongCache.get(key);showSoloSongMatches(field,[...local,...saved.filter(x=>!local.some(y=>norm(y.title)===norm(x.title)))].slice(0,8));setSoloSongStatus('已显示缓存结果；也可以直接填写。')}
  return;
 }
 if(!ctx.artist){setSoloSongStatus('请先确定音乐人，再查找作品名。');return}
 const ctrl=new AbortController();soloSongController=ctrl;
 const abort=setTimeout(()=>ctrl.abort(),5600);
 const uniq=xs=>{const seen=new Set();return xs.filter(x=>{const k=norm(x.title);if(!k||seen.has(k))return false;seen.add(k);return true})};
 let got=[];
 try{
  got=await musicBrainzSongFetch('recording',field,query,ctx,ctrl,token);
  if(token!==soloSongSeq)return;
  const first=uniq([...local,...got]).slice(0,8);showSoloSongMatches(field,first);
  if(got.length){setSoloSongStatus('已找到在线曲目。也可以继续输入自己的作品。')}
  // Album fallback is only triggered when there are few title matches.
  if(got.length<3 && !ctrl.signal.aborted){
   const album=await musicBrainzSongFetch('release-group',field,query,ctx,ctrl,token);
   if(token!==soloSongSeq)return;
   got=uniq([...got,...album]);showSoloSongMatches(field,uniq([...local,...got]).slice(0,8));
  }
  soloSongCache.set(key,got);
  if(token===soloSongSeq)setSoloSongStatus(got.length?'在线联想已更新，可选择歌曲或专辑。':'目录没有找到匹配的作品，可直接填写。');
 }catch(e){
  if(token===soloSongSeq){
   showSoloSongMatches(field,local);
   setSoloSongStatus('在线目录未连通或响应超时；已显示本地可用结果，仍可直接填写。');
  }
 }finally{clearTimeout(abort);if(soloSongController===ctrl)soloSongController=null}
}

 try{
  const response=await api('/api/artist-nominations/top'+(idxGenre==='all'?'':'?genre='+encodeURIComponent(idxGenre)));
  if(idxMode!=='artistIndex'||!root.querySelector('#onlineArtistIndex'))return;
  element.innerHTML=(response.entries||[]).length?response.entries.map((x,i)=>`<div class="index-line"><div><strong>${i+1}. ${esc(x.name)}</strong><div class="small">${esc(genreName(x.genre||idxGenre||''))} · ${x.uniqueNominators} 位提名者</div></div><strong>${x.nominations} 次</strong></div>`).join(''):'目前没有可计入站内指数的提名。';
 }catch(error){element.textContent='联网统计暂时不可用：'+String(error.message)}
}
function lookupIndex(name){
 const seq=++idxTicket;const e=root.querySelector('#indexLookup');if(!e)return;
 const local=localArtistIndex().find(x=>norm(x.name)===norm(name));
 e.innerHTML=`<div class="small">本机练习提名：${local?.mentions||0} 次 · ${apiBase()?'正在查询全站…':'全站需连接 Worker 才能查询'}</div>`;
 if(!apiBase()||!name.trim())return;
 api(artistIndexSearch(name,idxGenre==='all'?'':idxGenre)).then(x=>{
  if(seq!==idxTicket||!root.querySelector('#indexLookup'))return;
  e.innerHTML=`<div class="stat-quiet">站内被提名 <strong>${x.nominations||0}</strong> 次 · <strong>${x.uniqueNominators||0}</strong> 位独立提名者</div><div class="small">本机练习：${local?.mentions||0} 次 · 不计入站内数值</div>`;
 }).catch(()=>{if(seq===idxTicket)e.textContent=`本机练习：${local?.mentions||0} 次 · 全站统计连接失败`});
}
function showArtistNominationStats(){
 const area=root.querySelector('#suggestArea'),name=S.nomDraft.artist.trim();if(!area||!name||S.view!=='compose')return;
 let el=root.querySelector('#nominationCount');
 if(!el){el=document.createElement('div');el.id='nominationCount';el.className='mini-meta';area.insertAdjacentElement('afterend',el)}
 const chosen=S.nomDraft.picked,local=localArtistIndex().find(x=>norm(x.name)===norm(name));
 el.textContent=`本机提名 ${local?.mentions||0} 次 · ${apiBase()?'查询站内提名中…':'站内指数需联网'}`;
 if(!apiBase()||!chosen)return;
 const token=name;
 api(artistIndexSearch(name,idxGenre==='all'?'':idxGenre)).then(x=>{
  if(S.view!=='compose'||S.nomDraft.artist!==token)return;
  const node=root.querySelector('#nominationCount');if(node)node.textContent=`站内被提名 ${x.nominations||0} 次 · ${x.uniqueNominators||0} 位提名者（不影响战力）`;
 }).catch(()=>{const node=root.querySelector('#nominationCount');if(node)node.textContent=`本机提名 ${local?.mentions||0} 次 · 站内查询失败`});
}
const prevV12Home=renderHome;
renderHome=function(){idxMode='all';prevV12Home();root.querySelector('.rank-box')?.insertAdjacentHTML('afterend',`<div class="index-entry"><div><strong>站内艺人提名指数</strong><div class="small">查看哪些音乐人最常被提起</div></div>${button('查看 →','artistIndex','outline')}</div>`)};
const prevV12Compose=renderCompose;
renderCompose=function(){prevV12Compose();showArtistNominationStats()};
const prevV12Pick=pickSuggestion;
pickSuggestion=function(src,i){prevV12Pick(src,i);showArtistNominationStats()};
const prevV12Create=createArtist;
createArtist=function(){prevV12Create();showArtistNominationStats()};
const prevV12NextIncoming=nextIncoming;
nextIncoming=function(){S.incomingTaste=false;prevV12NextIncoming()};
const prevV12IncomingReply=renderIncomingReply;
renderIncomingReply=function(){
 prevV12IncomingReply();
 const c=root.querySelector('.chat');if(!c||!S.incoming?.track)return;
 const card=`<div class="taste-share"><div class="small">${S.incomingHeard?'顺便交换一下心头好':'TA 刚才安利的作品'}</div><strong>${esc(S.incoming.name)} · 《${esc(S.incoming.track)}》</strong><div class="small" style="margin-top:7px">${S.incomingHeard?'这不是继续考你，只是给你看看 TA 喜欢哪首。':'这首你如果也听过、而且喜欢，可以给 TA 一个回应。'}</div><button type="button" data-act="tasteGood" class="btn taste-button" ${S.incomingTaste?'disabled':''}>${S.incomingTaste?'已送出「有品！」':'这首我也喜欢 · 有品！'}</button></div>`;
 c.insertAdjacentHTML('afterend',card);
 if(S.incomingTaste){c.insertAdjacentHTML('beforeend',talk('你','有品！这首我也喜欢 (´▽｀)','me',true))}
};
const prevV12Score=scoreRound;
scoreRound=function(){const r=prevV12Score();r.tasteGood=!!S.incomingTaste;return r};
const prevV12RoundResult=renderRoundResult;
renderRoundResult=function(){prevV12RoundResult();if(S.results.at(-1)?.tasteGood)root.querySelector('.status')?.insertAdjacentHTML('beforeend',`<div class="taste-sent">✓ 已送出「有品！」· 不影响本轮胜负</div>`)};
const prevV12Final=renderFinal;
renderFinal=function(){prevV12Final();const praises=S.results.filter(x=>x.tasteGood).length;if(praises)root.querySelector('.final-rank')?.insertAdjacentHTML('afterend',`<div class="taste-sent">这局你给了 ${praises} 次「有品！」</div>`)};
// In same-screen play, an already-submitted song is shared after its recipient answers.
seatHistory=function(){return seat.history.map((x,i)=>({...x,i})).filter(x=>x.round===seat.round).map(x=>`<div class="history-row"><strong>${x.who==='a'?'A':'B'}：${esc(x.name)}</strong> · ${x.timeout?'超时':x.heard===true?'听过':x.heard===false?'没听过':'未回应'}${x.track?`<div class="small">本轮曲目：《${esc(x.track)}》</div>${x.taste?'<div class="taste-sent">有品！已送达</div>':`<button type="button" class="mini-taste" data-seat-taste="${x.i}">这首也喜欢 · 有品！</button>`}`:''}</div>`).join('')};
const prevV12Seat=renderSeat;
renderSeat=function(){prevV12Seat();if(seat.phase==='done')root.querySelector('.main')?.insertAdjacentHTML('beforeend',`<div class="section">本局推荐</div>${seat.history.map((x,i)=>x.track?`<div class="index-line"><span>${esc(x.who.toUpperCase())} · ${esc(x.name)}《${esc(x.track)}》</span>${x.taste?'有品！':`<button class="mini-taste" data-seat-taste="${i}">有品！</button>`}</div>`:'').join('')}`)};
roomExchanges=function(s){return(s.exchanges||[]).map((x,i)=>({x,i})).filter(v=>v.x.round===s.round).map(({x,i})=>`<div class="history-row"><strong>${x.role==='host'?'房主':'朋友'}</strong>：${esc(x.name)} · ${x.timeout?'超时':x.heard===true?'听过':x.heard===false?'没听过':'未回应'}${x.track?`<div class="small">本局曲目《${esc(x.track)}》</div>${x.tasteBy?.[live.room?.role]?'<div class="taste-sent">你已送出「有品！」</div>':x.tasteBy&&Object.values(x.tasteBy).some(Boolean)?'<div class="taste-sent">收到「有品！」</div>':x.role!==live.room?.role&&!s.completed?`<button type="button" class="mini-taste" data-room-taste="${i}">这首也喜欢 · 有品！</button>`:''}`:''}</div>`).join('')};
const prevV12Room=renderRoom;
renderRoom=function(){prevV12Room();if(live.mode!=='room')return;
 const s=live.room?.state;if(!s)return;
 if(s.phase==='done')root.querySelector('main')?.insertAdjacentHTML('beforeend',`<div class="section">双方推荐</div>${(s.exchanges||[]).filter(x=>x.track).map(x=>`<div class="index-line"><span>${esc(x.name)} · 《${esc(x.track)}》</span><span class="small">${x.tasteBy&&Object.values(x.tasteBy).some(Boolean)?'有品！':''}</span></div>`).join('')}`);
};
async function sendRoomTaste(i){if(live.busy||!live.room)return;live.busy=true;try{const x=await api('/api/rooms/'+live.room.code+'/actions','POST',{type:'taste',exchangeIndex:i});live.room=x.room;live.sig=JSON.stringify(x.room.state);renderRoom()}catch(err){live.err=String(err.message);renderRoom()}finally{live.busy=false}}
root.addEventListener('change',event=>{if(event.target.id==='idxGenre'){idxGenre=event.target.value;artistIndex()}});
root.addEventListener('input',event=>{if(event.target.id==='idxQuery'){idxQuery=event.target.value;clearTimeout(idxDebounce);idxDebounce=setTimeout(()=>lookupIndex(idxQuery),350)}});
root.addEventListener('click',event=>{
 const act=event.target.closest('[data-act]')?.dataset.act;
 if(act==='artistIndex'){artistIndex();return}
 if(act==='tasteGood'&&S.view==='incomingReply'&&!S.incomingTaste){S.incomingTaste=true;renderIncomingReply();const card=root.querySelector('.taste-share');if(card)card.insertAdjacentHTML('beforeend',`<div class="taste-sent">${esc(tastedReplies[Math.floor(Math.random()*tastedReplies.length)])}</div>`);return}
 const seatButton=event.target.closest('[data-seat-taste]');if(seatButton){let i=Number(seatButton.dataset.seatTaste);if(seat.history[i]){seat.history[i].taste=true;renderSeat()}return}
 const roomButton=event.target.closest('[data-room-taste]');if(roomButton){sendRoomTaste(Number(roomButton.dataset.roomTaste));return}
});

renderHome();
})();
</script>
</body>
</html>
